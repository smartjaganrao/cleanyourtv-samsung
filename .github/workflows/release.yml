name: Build & Release Samsung TV Package (.wgt)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Tizen WGT Application
        run: |
          python3 tools/package_wgt.py
          ls -la cleanyourtv-samsung.wgt
          sha256sum cleanyourtv-samsung.wgt > cleanyourtv-samsung.wgt.sha256
          echo "Built package SHA256:"
          cat cleanyourtv-samsung.wgt.sha256

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CleanYourTV Samsung ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            cleanyourtv-samsung.wgt
            cleanyourtv-samsung.wgt.sha256
