<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="ssGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Pure OLED Black Background -->
  <rect width="800" height="480" fill="#000000"/>
  
  <!-- Drifting Soft Ambient Halo -->
  <circle cx="430" cy="230" r="220" fill="url(#ssGlow)"/>

  <!-- Minimalist Thin Typography Clock -->
  <text x="430" y="240" font-family="'Outfit', -apple-system, sans-serif" font-size="108" font-weight="200" fill="#f8fafc" text-anchor="middle" letter-spacing="-3">12:00</text>
  <text x="430" y="280" font-family="'Outfit', -apple-system, sans-serif" font-size="22" font-weight="300" fill="#94a3b8" text-anchor="middle">Friday, October 24</text>
  <text x="430" y="440" font-family="-apple-system, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Anti-Burn-In Protection: Drifts randomly every 60 seconds</text>
</svg>
