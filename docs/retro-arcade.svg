<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="arcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="neonGlowLeft" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonGlowRight" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="arcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#arcBg)"/>
  <circle cx="350" cy="260" r="400" fill="url(#neonGlowLeft)"/>
  <circle cx="850" cy="260" r="400" fill="url(#neonGlowRight)"/>

  <!-- Left Card: Retro Arcade 4K -->
  <g transform="translate(50, 40)" filter="url(#arcShadow)">
    <rect width="520" height="440" rx="20" fill="#0d111a" stroke="#ec4899" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Top Badge -->
    <rect x="24" y="24" width="140" height="28" rx="14" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.2"/>
    <text x="94" y="43" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ec4899" text-anchor="middle" letter-spacing="1">60FPS WEB ENGINE</text>
    
    <text x="24" y="85" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">🕹️ Built-in Retro Arcade 4K</text>
    <text x="24" y="110" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8">5 Classic 60fps Games · Web Audio 8-Bit Synth · CRT Scanlines</text>

    <!-- Mini Canvas Mockup: Space Invaders & Brick Breaker -->
    <g transform="translate(24, 130)">
      <rect width="472" height="230" rx="12" fill="#06080e" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Stars -->
      <circle cx="45" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
      <circle cx="180" cy="70" r="1.5" fill="#fff" opacity="0.4"/>
      <circle cx="320" cy="40" r="2" fill="#fff" opacity="0.7"/>
      <circle cx="410" cy="110" r="1.5" fill="#fff" opacity="0.5"/>

      <!-- Bricks Row -->
      <rect x="30" y="25" width="38" height="12" rx="3" fill="#ef4444"/>
      <rect x="74" y="25" width="38" height="12" rx="3" fill="#ef4444"/>
      <rect x="118" y="25" width="38" height="12" rx="3" fill="#f97316"/>
      <rect x="162" y="25" width="38" height="12" rx="3" fill="#facc15"/>
      <rect x="206" y="25" width="38" height="12" rx="3" fill="#10b981"/>
      <rect x="250" y="25" width="38" height="12" rx="3" fill="#38bdf8"/>
      <rect x="294" y="25" width="38" height="12" rx="3" fill="#818cf8"/>
      <rect x="338" y="25" width="38" height="12" rx="3" fill="#ec4899"/>
      <rect x="382" y="25" width="38" height="12" rx="3" fill="#a855f7"/>

      <!-- Space Invaders Alien Ships -->
      <g transform="translate(80, 70)">
        <rect x="0" y="0" width="28" height="18" rx="4" fill="#38bdf8"/>
        <rect x="50" y="0" width="28" height="18" rx="4" fill="#38bdf8"/>
        <rect x="100" y="0" width="28" height="18" rx="4" fill="#f59e0b"/>
        <rect x="150" y="0" width="28" height="18" rx="4" fill="#f59e0b"/>
        <rect x="200" y="0" width="28" height="18" rx="4" fill="#ec4899"/>
        <rect x="250" y="0" width="28" height="18" rx="4" fill="#ec4899"/>
      </g>

      <!-- Player Cannon Ship & Lasers -->
      <polygon points="236,175 224,195 248,195" fill="#10b981"/>
      <rect x="234" y="135" width="4" height="16" fill="#38bdf8"/>
      <rect x="234" y="105" width="4" height="16" fill="#38bdf8"/>

      <!-- Arkanoid Paddle & Ball -->
      <rect x="40" y="195" width="80" height="10" rx="3" fill="#38bdf8"/>
      <circle cx="95" cy="160" r="6" fill="#fff"/>

      <!-- HUD Overlay -->
      <text x="30" y="222" font-family="monospace" font-size="11" fill="#64748b">SCORE: 2,480 · 60 FPS LOCKED · ZERO DOWNLOADS</text>
    </g>

    <!-- Bottom Features -->
    <text x="24" y="405" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981">✓ Brick Breaker · Space Defenders · Cyber Snake · Pong Pro · Tetriminos</text>
  </g>

  <!-- Right Card: Gamepad Stick Drift Radar -->
  <g transform="translate(630, 40)" filter="url(#arcShadow)">
    <rect width="520" height="440" rx="20" fill="#0d111a" stroke="#6366f1" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Top Badge -->
    <rect x="24" y="24" width="170" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.2"/>
    <text x="109" y="43" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="1">HTML5 GAMEPAD API</text>

    <text x="24" y="85" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">🎯 Stick Drift &amp; Controller Hub</text>
    <text x="24" y="110" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8">PS5 DualSense · Xbox Wireless · 8BitDo · Switch Pro · USB</text>

    <!-- Dual Radars Box -->
    <g transform="translate(24, 130)">
      <!-- Left Radar -->
      <g transform="translate(20, 0)">
        <rect width="200" height="220" rx="14" fill="#080b12" stroke="#1e293b" stroke-width="1"/>
        <text x="100" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Left Stick Radar</text>
        
        <!-- Radar Circle -->
        <circle cx="100" cy="100" r="60" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="15" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
        <circle cx="100" cy="100" r="35" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
        <line x1="40" y1="100" x2="160" y2="100" stroke="#334155" stroke-width="1"/>
        <line x1="100" y1="40" x2="100" y2="160" stroke="#334155" stroke-width="1"/>
        
        <!-- Pristine Stick Dot -->
        <circle cx="101" cy="99" r="6" fill="#10b981"/>
        <circle cx="101" cy="99" r="10" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5"/>

        <text x="100" y="185" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">0.4% (Pristine)</text>
        <text x="100" y="205" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">X: 0.002 · Y: -0.003</text>
      </g>

      <!-- Right Radar -->
      <g transform="translate(250, 0)">
        <rect width="200" height="220" rx="14" fill="#080b12" stroke="#1e293b" stroke-width="1"/>
        <text x="100" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Right Stick Radar</text>
        
        <!-- Radar Circle -->
        <circle cx="100" cy="100" r="60" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="15" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
        <circle cx="100" cy="100" r="35" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
        <line x1="40" y1="100" x2="160" y2="100" stroke="#334155" stroke-width="1"/>
        <line x1="100" y1="40" x2="100" y2="160" stroke="#334155" stroke-width="1"/>
        
        <!-- Right Stick Dot -->
        <circle cx="100" cy="100" r="6" fill="#10b981"/>
        <circle cx="100" cy="100" r="10" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5"/>

        <text x="100" y="185" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">0.0% (Pristine)</text>
        <text x="100" y="205" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">X: 0.000 · Y: 0.000</text>
      </g>
    </g>

    <!-- Bottom Features -->
    <text x="24" y="405" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#818cf8">✓ 360° Drift Radar · Analog Triggers · Dual Rumble · Couch D-Pad Nav</text>
  </g>
</svg>
