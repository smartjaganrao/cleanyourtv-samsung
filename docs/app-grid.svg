      <rect x="21" y="14" width="60" height="60" rx="14" fill="#282A2D"/>
      <path d="M42 28l15 20-15 20h12l15-20-15-20z" fill="#E5A00D"/>
      <text x="51" y="96" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Plex</text>
    </g>

    <!-- Tile 2 (Spotify) -->
    <g transform="translate(118, 6)">
