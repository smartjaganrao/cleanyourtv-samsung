<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Video Screen Background -->
  <rect width="800" height="480" fill="url(#streamGrad)"/>
  
  <!-- Simulated Live News Broadcast Frame -->
  <rect x="0" y="0" width="800" height="480" fill="#000000" fill-opacity="0.2"/>
  <text x="400" y="220" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" fill-opacity="0.15" text-anchor="middle">LIVE HLS 1080P STREAMING</text>

  <!-- Sliding EPG Channel Guide Sidebar (Left) -->
  <g transform="translate(0, 0)">
    <rect width="360" height="480" fill="rgba(11, 15, 24, 0.95)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <text x="24" y="38" font-family="'Outfit', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Live World Channels</text>
    <text x="24" y="56" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Free Broadcasts from All Countries</text>

    <!-- Country Column (mini) -->
    <g transform="translate(20, 72)">
      <rect width="86" height="32" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
      <text x="43" y="93" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">🌍 Global</text>

      <rect y="38" width="86" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="43" y="131" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🇺🇸 USA</text>

      <rect y="76" width="86" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="43" y="169" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🇬🇧 UK</text>

      <rect y="114" width="86" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="43" y="207" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🇮🇳 India</text>

      <rect y="152" width="86" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="43" y="245" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🇨🇦 Canada</text>

      <rect y="190" width="86" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="43" y="283" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🇩🇪 Germany</text>

      <rect y="228" width="86" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="43" y="321" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🇯🇵 Japan</text>

      <rect y="266" width="86" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="43" y="359" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🇫🇷 France</text>
    </g>

    <!-- Channels Column -->
    <g transform="translate(116, 72)">
      <!-- Channel 1: Focused -->
      <rect width="224" height="42" rx="10" fill="rgba(255, 255, 255, 0.22)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="12" y="99" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">01</text>
      <text x="36" y="99" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">ABC News Live</text>
      <rect x="175" y="86" width="38" height="18" rx="4" fill="rgba(255,255,255,0.15)"/>
      <text x="194" y="99" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">News</text>

      <!-- Channel 2 -->
      <g transform="translate(0, 48)">
        <rect width="224" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)"/>
        <text x="12" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">02</text>
        <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="13" fill="#e2e8f0">Sky News Live</text>
      </g>

      <!-- Channel 3 -->
      <g transform="translate(0, 96)">
        <rect width="224" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)"/>
        <text x="12" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">03</text>
        <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="13" fill="#e2e8f0">NDTV 24x7</text>
      </g>

      <!-- Channel 4 -->
      <g transform="translate(0, 144)">
        <rect width="224" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)"/>
        <text x="12" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">04</text>
        <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="13" fill="#e2e8f0">DW English</text>
      </g>

      <!-- Channel 5 -->
      <g transform="translate(0, 192)">
        <rect width="224" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)"/>
        <text x="12" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">05</text>
        <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="13" fill="#e2e8f0">Red Bull TV</text>
      </g>

      <!-- Channel 6 -->
      <g transform="translate(0, 240)">
        <rect width="224" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)"/>
        <text x="12" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">06</text>
        <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="13" fill="#e2e8f0">NASA TV</text>
      </g>
    </g>
  </g>

  <!-- On-Screen Display (OSD) Banner at Bottom -->
  <g transform="translate(380, 390)">
    <rect width="395" height="70" rx="16" fill="rgba(15, 20, 30, 0.88)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <rect x="16" y="16" width="46" height="38" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="39" y="40" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">01</text>

    <text x="74" y="34" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">ABC News Live</text>
    <text x="74" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">🇺🇸 US · News · 1080p</text>

    <rect x="310" y="22" width="65" height="24" rx="12" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444"/>
    <circle cx="324" cy="34" r="3.5" fill="#ef4444"/>
    <text x="345" y="38" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">LIVE</text>
  </g>
</svg>
